<footer class="site-footer">
  <div class="shell">
    <div class="footer-top">
      <div class="footer-brand">
        <a href="{{ '/' | relative_url }}" class="footer-brand__name">{{ site.title }}</a>
        <p>{{ site.description }}</p>
      </div>

      <div class="footer-nav" aria-label="页脚导航">
        <div class="footer-nav__column">
          <span class="footer-nav__label">浏览</span>
          <a href="{{ '/archive/' | relative_url }}">全部文章</a>
          <a href="{{ '/tags/' | relative_url }}">标签</a>
          <a href="{{ '/search/' | relative_url }}">搜索</a>
        </div>
        <div class="footer-nav__column">
          <span class="footer-nav__label">连接</span>
          <a href="{{ '/about/' | relative_url }}">关于我</a>
          <a href="{{ site.author.github }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <p>© {{ site.time | date: "%Y" }} {{ site.author.name }} · 文字自有它的去处</p>
      <p>用 <a href="https://jekyllrb.com/" target="_blank" rel="noopener noreferrer">Jekyll</a> 与 <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a> 慢慢搭建</p>
    </div>
  </div>
</footer>
