---
---
<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('affinity-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    {% seo %}
    {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}

    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">

    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"> 

    <script>
      window.SITE_BASEURL = {{ site.baseurl | jsonify }};
    </script>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </head>

  <body class="{% if page.body_class %}{{ page.body_class }}{% elsif page.layout == 'post' %}is-post{% elsif page.url == '/' %}is-home{% else %}is-page{% endif %}">
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div class="reading-progress" data-reading-progress aria-hidden="true"></div>

    {% include header.html %}

    <main id="main" class="site-main">
      {{ content }}
    </main>

    {% include footer.html %}

    <button class="back-to-top" type="button" data-back-to-top aria-label="回到页面顶部">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </body>
</html>
