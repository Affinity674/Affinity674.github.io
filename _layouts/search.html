---
layout: default
---
<div class="page search-page">
  <header class="page-header shell">
    <p class="eyebrow">SEARCH</p>
    <h1>找一段文字</h1>
    <p class="page-header__lead">
      搜索标题、标签或正文里的词。比如：开始、记录、生活。
    </p>
  </header>

  <div class="search shell">
    <div class="search__inner">
    <form class="search-form" role="search" data-search-form>
      <label class="visually-hidden" for="search-input">搜索文章</label>
      <div class="search-form__field">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="search" name="q" placeholder="输入一个词……" autocomplete="off" spellcheck="false" data-search-input>
        <button type="button" class="search-form__clear" data-search-clear aria-label="清空搜索" hidden>×</button>
      </div>
      <button class="button button--primary search-form__button" type="submit">搜索</button>
    </form>

    <p class="search-status" data-search-status aria-live="polite">输入关键词，开始寻找。</p>
    <div class="search-results" data-search-results></div>
    </div>
  </div>
</div>

<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
