<div class="page">
  <header class="page-header shell">
    <p class="eyebrow">{{ page.eyebrow | default: "NOTE" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-header__lead">{{ page.description }}</p>{% endif %}
  </header>

  <div class="page-body shell">
    {{ content }}
  </div>
</div>
