---
layout: default
---
<div class="page about-page">
  <div class="shell about-grid">
    <aside class="about-card">
      <div class="about-card__avatar">
        <img src="{{ site.author.avatar | relative_url }}" alt="{{ site.author.name }} 的头像" width="180" height="180">
      </div>
      <p class="eyebrow">HELLO, THERE</p>
      <h1>{{ page.title }}</h1>
      <p class="about-card__name">{{ site.author.name }}</p>
      <p class="about-card__bio">{{ site.author.bio }}</p>
      <a class="about-card__link" href="{{ site.author.github }}" target="_blank" rel="noopener noreferrer">
        GitHub
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 12 12 4M6 4h6v6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <p class="about-card__meta">BLOG · SINCE 2026</p>
    </aside>

    <div class="about-content">
      <p class="eyebrow">ABOUT THIS BLOG</p>
      <div class="prose">
        {{ content }}
      </div>

      <div class="about-contact">
        <div>
          <p class="eyebrow">STAY IN TOUCH</p>
          <h2>如果你愿意，常来坐坐。</h2>
        </div>
        <div class="about-contact__links">
          <a class="text-link" href="{{ '/feed.xml' | relative_url }}">订阅 RSS <span aria-hidden="true">→</span></a>
          <a class="text-link" href="{{ site.author.github }}" target="_blank" rel="noopener noreferrer">在 GitHub 找到我 <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </div>
  </div>
</div>
